name: Dev image (fork)

# Builds this fork's feature branches to ghcr.io/<owner>/silo-server,
# independent of docker.yml (which is gated to main/apiv2 and the trusted
# multi-platform release pipeline). linux/amd64 only, to keep a CGO Go build
# plus the Jellyfin ffmpeg packaging fast under QEMU emulation. Local,
# pre-PR iteration only.

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize branch name
        id: branch
        run: echo "tag=$(echo '${{ github.ref_name }}' | sed 's|/|-|g')" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/silo-server" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_DIRTY=false
            BUILD_NUMBER=0
            BUILD_DATE=${{ github.event.repository.updated_at }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.branch.outputs.tag }}
          cache-from: type=gha,scope=silo-server-dev-${{ steps.branch.outputs.tag }}
          cache-to: type=gha,mode=max,scope=silo-server-dev-${{ steps.branch.outputs.tag }}
